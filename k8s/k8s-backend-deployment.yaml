---
# Lampiao Backend Deployment
# Stateless API service with horizontal pod autoscaling

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lampiao-prod
  labels:
    app: lampiao
    component: backend
    version: v1
spec:
  replicas: 3  # Start with 3, adjust based on load
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lampiao
      component: backend
  template:
    metadata:
      labels:
        app: lampiao
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      # Service account for Kubernetes access control
      serviceAccountName: backend
      
      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      # Init container: Run database migrations
      initContainers:
        - name: migrate
          image: lampiao-backend:latest
          imagePullPolicy: Always
          command: ["npm", "run", "db:migrate"]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: db.port
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: db.user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lampiao-secrets
                  key: db.password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: db.name

      containers:
        - name: backend
          image: lampiao-backend:latest
          imagePullPolicy: Always
          
          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: db.port
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: db.user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lampiao-secrets
                  key: db.password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: db.name
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lampiao-secrets
                  key: jwt.secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: lampiao-secrets
                  key: google.client.id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lampiao-secrets
                  key: google.client.secret
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: api.url
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: lampiao-config
                  key: frontend.url

          # Liveness probe: Restart if unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness probe: Remove from service if unhealthy
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # Resource requests and limits
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Volume mounts for temporary files
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory

      # Affinity rules for pod distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - lampiao
                    - key: component
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname

---
# Service Account for Backend
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: lampiao-prod

---
# Horizontal Pod Autoscaler for Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: lampiao-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
