---
# ConfigMap: Non-sensitive application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: lampiao-config
  namespace: lampiao-prod
data:
  # Database configuration
  db.host: "postgres.lampiao-prod.svc.cluster.local"
  db.port: "5432"
  db.user: "lampiao"
  db.name: "lampiao_db"
  
  # API configuration
  api.url: "https://api.lampiao.com"  # Change to your domain
  frontend.url: "https://lampiao.com"  # Change to your domain
  
  # Application settings
  log.level: "info"
  cors.origin: "https://lampiao.com"
  
  # Rate limiting
  rate.limit.window: "15m"
  rate.limit.max.requests: "100"
  
  # Session configuration
  session.timeout: "24h"
  
  # Feature flags
  features.google.auth: "true"
  features.book.series: "true"
  features.post.drafts: "true"
  features.comments.threading: "true"

---
# Secret: Sensitive data (MUST be created separately, not in Git)
# This is a template. Create the actual secret with:
# kubectl create secret generic lampiao-secrets \
#   --from-literal=db.password='strong_password_here' \
#   --from-literal=jwt.secret='random_secret_key' \
#   --from-literal=google.client.id='...' \
#   --from-literal=google.client.secret='...' \
#   -n lampiao-prod

apiVersion: v1
kind: Secret
metadata:
  name: lampiao-secrets
  namespace: lampiao-prod
type: Opaque
data:
  # These are base64 encoded examples - REPLACE WITH ACTUAL VALUES
  # Generate with: echo -n 'value' | base64
  db.password: Y2hhbmdlX21lX2luX3Byb2R1Y3Rpb24=  # 'change_me_in_production'
  jwt.secret: c2VjcmV0X2tleV9jaGFuZ2VfaW4gcHJvZHVjdGlvbg==  # 'secret_key_change_in production'
  google.client.id: "your_google_client_id_base64"
  google.client.secret: "your_google_client_secret_base64"

---
# Secret for Docker image registry (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-credentials
  namespace: lampiao-prod
type: kubernetes.io/dockercfg
data:
