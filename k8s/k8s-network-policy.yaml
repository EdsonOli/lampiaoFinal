---
# Network Policy: Restrict ingress and egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lampiao-network-policy
  namespace: lampiao-prod
spec:
  podSelector:
    matchLabels:
      app: lampiao
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 4000
    - from:
        - podSelector:
            matchLabels:
              app: lampiao
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: lampiao-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
