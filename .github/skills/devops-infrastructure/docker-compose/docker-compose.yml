version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lampiao-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-lampiao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lampiao_dev_password}
      POSTGRES_DB: ${DB_NAME:-lampiao_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lampiao}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lampiao-network
    restart: unless-stopped

  # Lampiao Backend API
  backend:
    build:
      context: .
      dockerfile: .github/skills/devops-infrastructure/dockerfiles/Dockerfile.backend
    container_name: lampiao-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lampiao}
      DB_PASSWORD: ${DB_PASSWORD:-lampiao_dev_password}
      DB_NAME: ${DB_NAME:-lampiao_db}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_change_me}
      API_PORT: ${API_PORT:-3001}
      API_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:4200
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount source code for hot-reload in development
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules
    networks:
      - lampiao-network
    restart: unless-stopped
    command: npm run dev  # Use dev mode with hot-reload

  # Lampiao Frontend (Angular + SSR)
  frontend:
    build:
      context: .
      dockerfile: .github/skills/devops-infrastructure/dockerfiles/Dockerfile.frontend
    container_name: lampiao-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_URL: ${API_URL:-http://backend:3001}
      PORT: 4200
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      # Mount source code for development
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/node_modules:/app/node_modules
    networks:
      - lampiao-network
    restart: unless-stopped
    # Development mode: use ng serve instead of SSR
    command: >
      sh -c "npm install && ng serve --host 0.0.0.0 --poll=2000"

volumes:
  postgres_data:
    driver: local

networks:
  lampiao-network:
    driver: bridge
