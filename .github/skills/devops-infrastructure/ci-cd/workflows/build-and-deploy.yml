---
name: Build and Deploy Lampiao
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lampiao

jobs:
  # Job 1: Build and test backend
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lampiao
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: lampiao_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run TypeScript check
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lampiao
          DB_PASSWORD: test_password
          DB_NAME: lampiao_test
        run: npm test

      - name: Generate coverage report
        working-directory: backend
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend

  # Job 2: Build and test frontend
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run linter
        working-directory: frontend
        run: npm run lint || true

  # Job 3: Build Docker images
  build-images:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/skills/devops-infrastructure/dockerfiles/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/skills/devops-infrastructure/dockerfiles/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 4: Deploy to Kubernetes
  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f .github/skills/devops-infrastructure/kubernetes/k8s-namespace.yaml
          kubectl apply -f .github/skills/devops-infrastructure/kubernetes/k8s-configmap-secret.yaml
          kubectl apply -f .github/skills/devops-infrastructure/kubernetes/k8s-backend-deployment.yaml
          kubectl apply -f .github/skills/devops-infrastructure/kubernetes/k8s-frontend-deployment.yaml
          kubectl apply -f .github/skills/devops-infrastructure/kubernetes/k8s-database-deployment.yaml
          kubectl apply -f .github/skills/devops-infrastructure/kubernetes/k8s-service.yaml
          kubectl apply -f .github/skills/devops-infrastructure/kubernetes/k8s-ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n lampiao-prod --timeout=5m
          kubectl rollout status deployment/frontend -n lampiao-prod --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n lampiao-prod
          kubectl get services -n lampiao-prod
          kubectl get ingress -n lampiao-prod

  # Job 5: Rollback on failure
  rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/backend -n lampiao-prod
          kubectl rollout undo deployment/frontend -n lampiao-prod
          kubectl rollout status deployment/backend -n lampiao-prod --timeout=5m
          kubectl rollout status deployment/frontend -n lampiao-prod --timeout=5m

      - name: Send notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Lampiao deployment FAILED! Automatic rollback executed.'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
