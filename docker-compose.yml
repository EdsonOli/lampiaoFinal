services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lampiao-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-lampiao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lampiao_dev_password}
      POSTGRES_DB: ${DB_NAME:-lampiao_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lampiao} -d ${DB_NAME:-lampiao_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lampiao-network
    restart: unless-stopped

  # Lampiao Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lampiao-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3001}
      DB_DIALECT: ${DB_DIALECT:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lampiao}
      DB_PASSWORD: ${DB_PASSWORD:-lampiao_dev_password}
      DB_NAME: ${DB_NAME:-lampiao_db}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_change_me}
      API_PORT: ${API_PORT:-3001}
      API_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:4200
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/auth/google/callback}
      SKIP_DB_SYNC: ${SKIP_DB_SYNC:-false}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount source code for hot-reload in development
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules
    networks:
      - lampiao-network
    restart: unless-stopped
    command: >
      sh -c "npm run db:migrate && npm run dev"

  # Lampiao Frontend (Angular + SSR)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lampiao-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_URL: ${API_URL:-http://backend:3001}
      PORT: 4000
    ports:
      - "4200:4000"
    depends_on:
      - backend
    networks:
      - lampiao-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  lampiao-network:
    driver: bridge
